<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root{
--bg:#1C1B19; --bg2:#242220; --bg3:#2C2A27; --line:#3A3733;
--text:#EDE8DF; --muted:#B9B2A6; --faint:#8E877C;
--accent:#FF7A1A; --accent-dark:#1C1B19;
--radius:14px;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Noto Sans TC","Noto Sans CJK TC",system-ui,sans-serif;line-height:1.65;-webkit-font-smoothing:antialiased}
a{color:inherit}
button{font-family:inherit;cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:0 18px 56px}

/* Top bar */
.topbar{position:sticky;top:0;z-index:50;background:rgba(28,27,25,.96);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar-in{max-width:760px;margin:0 auto;padding:12px 18px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:900;font-size:17px;letter-spacing:.02em;text-decoration:none;display:flex;align-items:center;gap:8px}
.brand.dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--bg3);color:var(--text);border-radius:999px;padding:10px 18px;font-weight:700;font-size:15px;text-decoration:none;transition:opacity.15s}
.btn:active{opacity:.75}
.btn-accent{background:var(--accent);border-color:var(--accent);color:#1C1B19}
.btn-small{padding:8px 14px;font-size:14px}
.btn-block{width:100%;padding:14px}
.btn-ghost{background:transparent}

/* Hero */
.hero{padding:38px 0 8px}
.hero h1{font-size:clamp(30px,7.5vw,44px);font-weight:900;line-height:1.25;margin:0 0 12px;letter-spacing:.01em}
.hero p{color:var(--muted);font-size:17px;margin:0 0 22px}
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0 6px}
.stat{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:14px 10px;text-align:center}
.stat b{display:block;font-size:22px;font-weight:900;color:var(--accent)}
.stat span{font-size:13px;color:var(--muted)}

h2.sec{font-size:22px;font-weight:900;margin:38px 0 6px}
p.sec-sub{color:var(--muted);margin:0 0 16px;font-size:15px}

/* Composition grid */
.comp-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(min-width:640px){.comp-grid{grid-template-columns:repeat(4,1fr)}}
.comp{border:1px solid var(--line);border-radius:var(--radius);padding:16px 12px;background:var(--bg2);text-align:left;width:100%;color:var(--text)}
.comp b{display:block;font-size:16px;margin-bottom:2px}
.comp span{font-size:12.5px;color:var(--muted)}
.comp.go{color:var(--accent);font-weight:700;font-size:13px;margin-top:8px;display:block}
.comp.disabled{opacity:.45;filter:grayscale(.7)}
.comp.disabled.go{color:var(--faint)}

/* Tool cards */
.tool-card{border:1px solid var(--line);border-radius:18px;background:var(--bg2);padding:20px;margin-bottom:14px}
.tool-card h3{font-size:19px;font-weight:900;line-height:1.45;margin:10px 0 6px}
.tool-card p{color:var(--muted);font-size:14.5px;margin:0 0 14px}
.tag{display:inline-block;font-size:12.5px;font-weight:700;border:1px solid var(--accent);color:var(--accent);border-radius:999px;padding:2px 10px}
.tag.grey{border-color:var(--line);color:var(--muted)}
.meta{font-size:13.5px;color:var(--faint);margin-bottom:14px}
.btn-row{display:flex;gap:10px;flex-wrap:wrap}
.btn-row.btn{flex:1;min-width:120px}

/* Steps */
.steps{display:grid;gap:10px}
@media(min-width:640px){.steps{grid-template-columns:repeat(3,1fr)}}
.step{background:var(--bg2);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.step b{color:var(--accent);font-size:13px;display:block;margin-bottom:4px}
.step p{margin:0;font-size:14.5px}
.step p b{color:var(--text);font-size:15px;display:inline}

/* Footer */
footer{margin-top:44px;border-top:1px solid var(--line);padding-top:24px}
footer h3{font-size:17px;margin:0 0 4px}
footer p{color:var(--muted);font-size:14px;margin:0 0 16px}
.socials{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.socials a{border:1px solid var(--line);border-radius:var(--radius);padding:13px;text-decoration:none;font-weight:700;font-size:15px;background:var(--bg2);display:flex;justify-content:space-between;align-items:center}
.socials a span{color:var(--accent)}
.foot-note{color:var(--faint);font-size:12.5px;margin-top:20px}

/* Episode pages */
.backlink{display:inline-block;color:var(--muted);text-decoration:none;font-size:14px;margin:18px 0 4px}
.ep-head{padding:10px 0 4px}
.ep-head h1{font-size:clamp(24px,6vw,32px);font-weight:900;line-height:1.4;margin:12px 0 8px}
.ep-head.solve{color:var(--muted);font-size:16px;margin:0 0 16px}
.badge-making{display:inline-block;background:var(--accent);color:#1C1B19;font-weight:900;font-size:13px;border-radius:8px;padding:4px 10px;margin-left:8px;vertical-align:middle}
.panel{background:var(--bg2);border:1px solid var(--line);border-radius:18px;padding:20px;margin-top:14px}
.panel h2{font-size:19px;font-weight:900;margin:0 0 6px}
.panel.sub{color:var(--muted);font-size:14.5px;margin:0 0 16px}
.seg{display:flex;background:var(--bg3);border:1px solid var(--line);border-radius:999px;padding:4px;gap:4px;flex-wrap:wrap;margin-bottom:14px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);font-weight:700;font-size:14.5px;padding:9px 8px;border-radius:999px;white-space:nowrap}
.seg button.on{background:var(--accent);color:#1C1B19}
.verdict{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:14px 16px;font-size:15px}
.verdict b{color:var(--accent)}
.big-num{font-size:clamp(26px,6.5vw,34px);font-weight:900;color:var(--accent);line-height:1.3;margin:6px 0 2px}
.big-label{font-size:13.5px;color:var(--muted)}
.breakdown{margin:14px 0 0;padding:0;list-style:none}
.breakdown li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:14.5px}
.breakdown li:last-child{border-bottom:0}
.breakdown li span:first-child{color:var(--muted)}
.breakdown li span:last-child{font-weight:700;text-align:right;white-space:nowrap}
.note{font-size:13px;color:var(--faint);margin-top:12px}
.warn{border:1px solid var(--accent);border-radius:12px;padding:14px 16px;font-size:14.5px;margin-top:14px;background:rgba(255,122,26,.07)}
.warn b{color:var(--accent)}

/* Checklist */
.progress{height:10px;background:var(--bg3);border-radius:99px;overflow:hidden;margin:10px 0 4px}
.progress i{display:block;height:100%;background:var(--accent);width:0;transition:width.3s}
.progress-txt{font-size:13px;color:var(--muted);margin-bottom:10px}
.check{list-style:none;margin:0;padding:0}
.check li{border-bottom:1px solid var(--line)}
.check li:last-child{border-bottom:0}
.check label{display:flex;gap:12px;padding:12px 2px;cursor:pointer;align-items:flex-start;font-size:15px}
.check input{appearance:none;width:22px;height:22px;flex:none;border:2px solid var(--faint);border-radius:6px;margin-top:2px;background:transparent;position:relative;cursor:pointer}
.check input:checked{background:var(--accent);border-color:var(--accent)}
.check input:checked::after{content:"✓";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#1C1B19;font-weight:900;font-size:14px}
.check input:checked ~ span{color:var(--faint);text-decoration:line-through}
.check.hint{display:block;font-size:13px;color:var(--faint);text-decoration:none}
.check-group{font-weight:900;font-size:15px;margin:16px 0 2px;color:var(--accent)}
.check-group:first-child{margin-top:4px}

/* When to go */
.when{list-style:none;margin:0;padding:0}
.when li{padding:11px 0;border-bottom:1px solid var(--line);font-size:15px}
.when li:last-child{border-bottom:0}
.when b{color:var(--accent)}

/* Toast */
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--accent);color:#1C1B19;font-weight:900;padding:12px 22px;border-radius:999px;font-size:15px;opacity:0;pointer-events:none;transition:all.25s;z-index:99;max-width:88vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.next-card{display:block;text-decoration:none}
.next-card h3{margin:8px 0 4px}
.share-btns{display:grid;gap:10px}
@media(min-width:560px){.share-btns{grid-template-columns:1fr 1fr}.share-btns.btn:first-child{grid-column:1/-1}}
</style>
</head>

<script>
/* ============ helpers ============ */
var UTM = function(c){ return "utm_source=toolkit&utm_medium=share&utm_campaign="+c;};
var YT = {
kansai: "https://www.youtube.com/watch?v=OYKpmdhZX2A",
ep1: "https://www.youtube.com/watch?v=FWLbWwtYuEI",
channel: "https://www.youtube.com/@zizainiao"
};
function ytLink(ep){ return YT[ep] + "?" + UTM(ep);}
function fmt(n){ return n.toLocaleString("en-US");}
function yen(a,b){ return "¥" + fmt(a) + "–" + fmt(b);}
function nt(a,b){ return "NT$" + fmt(a) + "–" + fmt(b);}

var toastTimer=null;
function toast(msg){
var t=document.getElementById("toast");
t.textContent=msg; t.classList.add("show");
clearTimeout(toastTimer);
toastTimer=setTimeout(function(){ t.classList.remove("show");},2600);
}
function copyText(text, okMsg){
function done(){ toast(okMsg||"已複製");}
if(navigator.clipboard && navigator.clipboard.writeText){
navigator.clipboard.writeText(text).then(done).catch(function(){ fallback();});
} else fallback();
function fallback(){
var ta=document.createElement("textarea");
ta.value=text; ta.style.position="fixed"; ta.style.opacity="0";
document.body.appendChild(ta); ta.select();
try{ document.execCommand("copy"); done();}catch(e){ toast("複製失敗，請長按選取文字");}
document.body.removeChild(ta);
}
}
function store(key, val){ try{ localStorage.setItem(key, JSON.stringify(val));}catch(e){}}
function load(key, def){ try{ var v=localStorage.getItem(key); return v?JSON.parse(v):def;}catch(e){ return def;}}

/* ============ router ============ */
function parseRoute(){
var h = location.hash.replace(/^#/, "") || "/";
var qIdx = h.indexOf("?");
var path = qIdx>=0? h.slice(0,qIdx): h;
var params = {};
if(qIdx>=0){
h.slice(qIdx+1).split("&").forEach(function(p){
var kv=p.split("="); if(kv[0]) params[decodeURIComponent(kv[0])] = decodeURIComponent(kv[1]||"");
});
}
return { path: path, params: params};
}
function shareUrl(ep, state){
var qs = Object.keys(state).map(function(k){ return encodeURIComponent(k)+"="+encodeURIComponent(state[k]);}).join("&");
return "#/" + ep + (qs? "?" + qs: "");
}

return '<button class="comp disabled" data-soon="1"><b>'+c.name+'</b><span>'+c.desc+'</span><span class="go">即將推出</span></button>';

'<section class="hero">' +
'<h1>先看你是誰，<br>再決定去哪</h1>' +

'<div class="stat-row">' +
'<div class="stat"><b>3 個</b><span>已上線工具包</span></div>' +
'<div class="stat"><b>8 種</b><span>旅行組成</span></div>' +
'<div class="stat"><b>免登入</b><span>打開就能用</span></div>' +
'</div>' +
'</section>' +

'<h2 class="sec">找你的組成</h2>' +
'<p class="sec-sub">先選你是哪一種旅行，再拿對的工具。還沒上線的組成，影片拍好工具就跟著上。</p>' +
'<div class="comp-grid">' + compHtml + '</div>' +

'<h2 class="sec" id="tools">已上線工具包</h2>' +
'<p class="sec-sub">每一包都對應一集影片：工具先算，影片看懂為什麼。</p>' +

'<div class="tool-card">' +
'<span class="tag">親子家庭</span> <span class="tag grey">影片製作中，工具先行</span>' +
'<h3>帶 3 歲小孩去沖繩，第一次就自駕？先驗證這三件事再排景點</h3>' +

'<div class="btn-row"><a class="btn btn-accent" href="#/okinawa">用工具</a><a class="btn" href="'+YT.channel+'?'+UTM("okinawa")+'" target="_blank" rel="noopener">看影片（製作中）</a></div>' +

'<a href="https://www.facebook.com/profile.php?id=61596159220235" target="_blank" rel="noopener">Facebook <span>→</span></a>' +
'</div>' +
'<p class="foot-note">勾選和試算會存在這台裝置的瀏覽器裡，換裝置或換瀏覽器要重新算、重新勾。所有金額都是查價當時的區間估算，不是定價，出發前請對官網重查。</p>' +

el.addEventListener("click", function(){ toast("這集還在拍，工具會跟著影片一起上");});

/* ============ shared episode pieces ============ */
function checklistHtml(id, groups, saved){
var html = "";
groups.forEach(function(g){
if(g.title) html += '<div class="check-group">'+g.title+'</div>';
html += '<ul class="check">';
g.items.forEach(function(it){
var key = g.title? g.title+"|"+it.t: it.t;
var checked = saved.indexOf(key)>=0? " checked": "";
html += '<li><label><input type="checkbox" data-list="'+id+'" value="'+key.replace(/"/g,"&quot;")+'"'+checked+'><span>'+it.t+(it.h?'<span class="hint">'+it.h+'</span>':"")+'</span></label></li>';
});
html += '</ul>';
});
return html;
}
function bindChecklist(id, groups){
var boxes = document.querySelectorAll('input[data-list="'+id+'"]');
function update(){
var total = boxes.length, done = 0, vals=[];
boxes.forEach(function(b){ if(b.checked){ done++; vals.push(b.value);}});
var bar = document.getElementById(id+"-bar"), txt = document.getElementById(id+"-ptxt");
if(bar) bar.style.width = (total? Math.round(done/total*100):0) + "%";
if(txt) txt.textContent = "已完成 " + done + " / " + total + " 項";
store("toolkit_"+id+"_check", vals);
return {done:done, total:total};
}
boxes.forEach(function(b){ b.addEventListener("change", update);});
return update();
}
function progressHtml(id){
return '<div class="progress"><i id="'+id+'-bar"></i></div><div class="progress-txt" id="'+id+'-ptxt"></div>';
}
function sharePanel(ep, title, getState, getText, nextEp, nextTitle, nextDesc, videoBtn){
var url = shareUrl(ep, getState());
return '<div class="panel">' +
'<h2>分享與下一步</h2>' +
'<p class="sub">把你算好的這一份直接傳給同行的人。複製結果會附上帶著你選擇的工具連結（#/集數?參數），對方用同一個工具包打開，看到的就是你現在這一組選擇。</p>' +
'<div class="share-btns">' +
'<button class="btn btn-accent" id="share-text">📋 複製我的結果（貼到 LINE）</button>' +
'<button class="btn" id="share-link">🔗 複製分享連結</button>' +
'<button class="btn" id="share-native">↗ 用手機分享</button>' +
'</div>' +
(videoBtn || "") +
'<a class="tool-card next-card" href="#/'+nextEp+'" style="display:block;margin-top:16px">' +
